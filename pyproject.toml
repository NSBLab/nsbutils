[project]
name = "nsbutils"
version = "0.1.0"
description = "Neuroimaging tools developed by the Neural Systems and Behaviour Lab"
readme = "README.rst"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9.4",
    "neuromodes @ git+https://github.com/NSBLab/neuromodes.git@refs/pull/15/head",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "surfplot>=0.2.0",
]

[project.optional-dependencies]
testing = [
    "pytest>=8.4.2",
]
tutorials = [
    "ipykernel>=6.31.0",
]
plotting = [
    "kaleido>=1.2.0",
    "nbformat>=5.10.4",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nsbutils"]

[tool.pytest.ini_options]
python_functions = ["test_"]
python_files = ["test_*.py",]
testpaths = ["tests",]

[project.urls]
"Homepage" = "https://nsbutils.readthedocs.io"
